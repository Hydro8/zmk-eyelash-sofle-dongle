name: Build and Generate Keymap

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build peripheral-left with the ZMK Docker image (has everything pre-installed)
  # then extract the merged devicetree containing the keymap
  # ---------------------------------------------------------------------------
  generate-keymap-json:
    name: Generate keymap.json
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/zmkfirmware/zmk-dev-arm:latest

    steps:
      # ---- 1. Checkout source ------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---- 2. Init West workspace ---------------------------------------------
      - name: West init
        run: |
          west init -l config
          west update 2>&1 || west update 2>&1

      # ---- 3. Build peripheral-left (contains the keymap) --------------------
      - name: Build peripheral left
        run: |
          west build -b nice_nano@2 -s config \
            -- -DSHIELD=eyelash_sofle_peripheral_left

      # ---- 4. Collect ALL devicetree files -----------------------------------
      - name: Collect devicetree files
        run: |
          BUILD_DIR=build
          ARTIFACT_DT=devicetree-files

          mkdir -p "${ARTIFACT_DT}"

          cp "${BUILD_DIR}/zephyr/zephyr.dts.pre" "${ARTIFACT_DT}/" 2>/dev/null || true
          cp "${BUILD_DIR}/zephyr/zephyr.dts" "${ARTIFACT_DT}/" 2>/dev/null || true
          cp "${BUILD_DIR}/zephyr/include/generated/zephyr/zephyr.dts" \
             "${ARTIFACT_DT}/zephyr.dts.generated" 2>/dev/null || true
          cp "${BUILD_DIR}/zephyr/include/generated/zephyr/devicetree_generated.h" \
             "${ARTIFACT_DT}/devicetree_generated.h" 2>/dev/null || true
          find "${BUILD_DIR}" -name "*.dtsi" -path "*zmk*" \
               -exec cp {} "${ARTIFACT_DT}/" \; 2>/dev/null || true

          echo "=== Files collected ==="
          ls -lhR "${ARTIFACT_DT}/"

      # ---- 5. Upload devicetree artifacts (for debugging) ---------------------
      - name: Upload devicetree files
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-files
          path: devicetree-files/
          retention-days: 7

      # ---- 6. Run parser (once written) to produce keymap.json -------------
      - name: Generate keymap.json
        run: |
          # python3 scripts/parse_keymap.py \
          #   --dts devicetree-files/zephyr.dts \
          #   --output devicetree-files/keymap.json
          echo "Parser placeholder – keymap.json will be generated here."

      # ---- 7. Upload keymap.json artifact -----------------------------------
      - name: Upload keymap.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keymap-json
          path: |
            devicetree-files/keymap.json
          retention-days: 14
          if-no-files-found: warn
