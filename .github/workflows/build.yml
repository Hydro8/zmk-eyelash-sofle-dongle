name: ZMK Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      config_path: config

  extract-dts-pre:
    name: Extract devicetree files
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: West init + update
        run: west init -l config && west update || west update

      - name: West build
        continue-on-error: true
        run: west build -s zmk/app -b nice_nano@2 --pristine -d build-dongle -- -DBOARD_ROOT="$GITHUB_WORKSPACE" -DSHIELD="eyelash_sofle_central_dongle dongle_display raw_hid_adapter" -DZMK_CONFIG="$GITHUB_WORKSPACE/config"

      - name: Capture DTS
        if: always()
        run: mkdir -p dts-extracted && cp build-dongle/zephyr/zephyr.dts.pre dts-extracted/ 2>/dev/null; cp build-dongle/zephyr/zephyr.dts dts-extracted/ 2>/dev/null; find build-dongle -name "*.dtsi" -exec cp {} dts-extracted/ \; 2>/dev/null; ls -la dts-extracted/; grep -c "keymap" dts-extracted/zephyr.dts.pre 2>/dev/null || echo "no keymap"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devicetree-files
          path: dts-extracted/
          retention-days: 7