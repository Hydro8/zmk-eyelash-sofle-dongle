name: ZMK Firmware Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@1e7371f2654bed123727ec15adb42af344c1bb3d
    with:
      config_path: config

  extract-dts-pre:
    name: Build dongle + extract keymap
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: West init + update
        run: west init -l config && west update

      - name: Freeze west manifest
        run: west manifest --freeze --active-only > west-frozen.yml

      - uses: actions/upload-artifact@v4
        with:
          name: west-frozen
          path: west-frozen.yml
          retention-days: 30

      - name: West build (dongle)
        continue-on-error: true
        run: west build -s zmk/app -b nice_nano@2 --pristine -d build-dongle -- -DBOARD_ROOT="$GITHUB_WORKSPACE" -DSHIELD="eyelash_sofle_central_dongle dongle_display raw_hid_adapter" -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/zephyr/share/zephyr-package"

      - name: Parse keymap from devicetree
        if: always()
        run: |
          python3 scripts/parse_keymap.py build-dongle/zephyr/zephyr.dts.pre -o keymap.json
          echo "=== Keymap summary ==="
          python3 -c "
          import json
          with open('keymap.json') as f:
              d = json.load(f)
          print(f\"Layout: {d['layout']}\")
          print(f\"Layers: {len(d['layers'])}\")
          for l in d['layers']:
              print(f\"  [{l['id']}] {l['name']} ({l['type']}) - {len(l['keys'])} keys\")
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keymap-json
          path: keymap.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devicetree-debug
          path: build-dongle/zephyr/zephyr.dts.pre
          retention-days: 7

  forensic-run200:
    name: Forensic reconstruct run #200 all firmware
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    steps:
      - name: Checkout reference workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Prepare isolated ZMK workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zmk-config /tmp/run200-*
          mkdir -p /tmp/zmk-config/config /tmp/run200-artifacts
          cp -R config/* /tmp/zmk-config/config/
          west init -l /tmp/zmk-config/config
          cd /tmp/zmk-config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
          west manifest --freeze --active-only > /tmp/run200-artifacts/west-frozen.yml
          west list -f '{name} {revision}' > /tmp/run200-artifacts/west-revisions.txt

      - name: Verify historical revisions
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zmk-config
          test "$(git -C zephyr rev-parse HEAD)" = "9df4b12b5af3438a8b9d7a33780dc3b3b2f516c1"
          test "$(git -C zmk rev-parse HEAD)" = "1e7371f2654bed123727ec15adb42af344c1bb3d"
          echo "Zephyr: $(git -C zephyr rev-parse HEAD)"
          echo "ZMK:    $(git -C zmk rev-parse HEAD)"
          echo "git describe before override: $(git -C zephyr describe --abbrev=12 --always)"

      - name: Reconstruct and verify all historical firmware
        shell: bash
        env:
          BUILD_VERSION: 9df4b12b5af3
        run: |
          set -euo pipefail
          cd /tmp/zmk-config
          mismatch=0

          copy_if_exists() {
            src="$1"
            dst="$2"
            if [ -f "${src}" ]; then
              cp "${src}" "${dst}"
            else
              echo "INFO: optional forensic evidence missing: ${src}"
            fi
          }

          build_and_verify() {
            name="$1"
            shield="$2"
            expected="$3"

            if [ "${name}" = "dongle" ]; then
              build_dir="${GITHUB_WORKSPACE}/build"
              zmk_config="${GITHUB_WORKSPACE}/config"
              echo "FORENSIC PATH TEST: dongle uses historical workspace paths"
            else
              build_dir="/tmp/run200-${name}"
              zmk_config="/tmp/zmk-config/config"
            fi

            evidence_dir="/tmp/run200-artifacts/${name}-build"

            echo "=== Building ${name} ==="
            echo "build_dir=${build_dir}"
            echo "ZMK_CONFIG=${zmk_config}"
            echo "ZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}"
            west build -s zmk/app -d "${build_dir}" -b "nice_nano@2" -- \
              -DZMK_CONFIG="${zmk_config}" \
              -DSHIELD="${shield}" \
              -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
              -DBUILD_VERSION="${BUILD_VERSION}"

            actual="$(sha256sum "${build_dir}/zephyr/zmk.uf2" | awk '{print $1}')"
            bytes="$(wc -c < "${build_dir}/zephyr/zmk.uf2")"
            banner="$(strings "${build_dir}/zephyr/zmk.elf" | grep -F 'Booting Zephyr OS build' || true)"

            echo "${name} SHA256: ${actual}"
            echo "${name} bytes:  ${bytes}"
            echo "${name} banner: ${banner}"
            echo "${expected}  ${name}" >> /tmp/run200-artifacts/expected-sha256.txt
            echo "${actual}  ${name}" >> /tmp/run200-artifacts/actual-sha256.txt

            mkdir -p "${evidence_dir}"
            cp "${build_dir}/zephyr/zmk.uf2" "/tmp/run200-artifacts/${name}.uf2"
            cp "${build_dir}/zephyr/zmk.elf" "${evidence_dir}/zmk.elf"
            copy_if_exists "${build_dir}/zephyr/zephyr.map" "${evidence_dir}/zephyr.map"
            copy_if_exists "${build_dir}/zephyr/.config" "${evidence_dir}/.config"
            copy_if_exists "${build_dir}/zephyr/zephyr.dts" "${evidence_dir}/zephyr.dts"
            copy_if_exists "${build_dir}/zephyr/include/generated/zephyr/autoconf.h" "${evidence_dir}/autoconf.h"
            copy_if_exists "${build_dir}/build.ninja" "${evidence_dir}/build.ninja"
            copy_if_exists "${build_dir}/CMakeCache.txt" "${evidence_dir}/CMakeCache.txt"
            copy_if_exists "${build_dir}/zephyr/zephyr.dts.pre" "${evidence_dir}/zephyr.dts.pre"
            sha256sum "${evidence_dir}"/* > "${evidence_dir}/sha256.txt" || true

            if [ "${actual}" != "${expected}" ]; then
              echo "ERROR: ${name} does not match historical run #200" >&2
              mismatch=1
            else
              echo "MATCH: ${name} matches historical run #200 bit-for-bit"
            fi
          }

          build_and_verify \
            settings_reset \
            "settings_reset" \
            "4076265ae4fe0941f27494846b43d6c55d0a34635e3dc99c86f6ff1e8b61545c"

          build_and_verify \
            dongle \
            "eyelash_sofle_central_dongle dongle_display raw_hid_adapter" \
            "9ce6d030e6fa51bda034c169ee03b15c440b0e2d29e901a8118ec2169219ce83"

          build_and_verify \
            left \
            "eyelash_sofle_peripheral_left" \
            "4c3629877a5a30a2c395f53f9b924ca26ea24289cf0b2f4a78559be139cfe1ec"

          build_and_verify \
            right \
            "eyelash_sofle_peripheral_right" \
            "381b604588ccd3b01e36ec4b95d966b7689b6d1b274e90ffaae06fda53ac6752"

          echo "=== RUN #200 RECONSTRUCTION SUMMARY ==="
          cat /tmp/run200-artifacts/actual-sha256.txt

          if [ "${mismatch}" -ne 0 ]; then
            echo "ERROR: at least one reconstructed firmware differs from historical run #200" >&2
            exit 1
          fi

          echo "=== ALL FOUR RUN #200 UF2 FILES MATCH BIT-FOR-BIT ==="

      - name: Archive reconstructed UF2 files and forensic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forensic-run200-all-firmware
          path: /tmp/run200-artifacts/
          retention-days: 30
