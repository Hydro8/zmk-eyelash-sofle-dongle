name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      matrix:
        include:
          - board: nice_nano
            board_revision: 2
            shield: eyelash_sofle_central_dongle dongle_display
            snippet: studio-rpc-usb-uart
            cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
          - board: nice_nano
            board_revision: 2
            shield: eyelash_sofle_peripheral_left nice_view
          - board: nice_nano
            board_revision: 2
            shield: eyelash_sofle_peripheral_right nice_view
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup ZMK
        uses: zmkfirmware/zmk/.github/actions/setup@main
      - name: Build
        uses: zmkfirmware/zmk/.github/actions/build@main
        with:
          board: ${{ matrix.board }}
          board_revision: ${{ matrix.board_revision }}
          shield: ${{ matrix.shield }}
          snippet: ${{ matrix.snippet }}
          cmake-args: ${{ matrix.cmake-args }}