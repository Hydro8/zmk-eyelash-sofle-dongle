# .github/workflows/build.yml

name: ZMK Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      config_path: config

  extract-dts-pre:
    name: Extract devicetree files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl python3 python3-pip python3-venv \
            ninja-build gperf ccache dfu-util device-tree-compiler

      - name: Install West
        run: pip3 install --user west

      - name: Ensure west in PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: West init
        run: west init -l config

      - name: West update
        run: |
          west update || west update

      - name: Install Python requirements
        run: pip3 install --user -r zephyr/scripts/requirements.txt

      - name: West build (configure + attempt)
        run: |
          west build -s zmk/app -b nice_nano@2 \
            --pristine \
            -d build-dongle \
            -- \
            -DSHIELD="eyelash_sofle_central_dongle dongle_display raw_hid_adapter" \
            -DZMK_CONFIG="${{ github.workspace }}/config"
        continue-on-error: true

      - name: Capture devicetree files
        if: always()
        run: |
          DTS_OUT="${{ github.workspace }}/dts-extracted"
          mkdir -p "$DTS_OUT"

          cp build-dongle/zephyr/zephyr.dts.pre     "$DTS_OUT/" 2>/dev/null || echo "zephyr.dts.pre not found"
          cp build-dongle/zephyr/zephyr.dts          "$DTS_OUT/" 2>/dev/null || echo "zephyr.dts not found"
          cp build-dongle/zephyr/include/generated/zephyr/zephyr.dts  "$DTS_OUT/" 2>/dev/null || echo "generated zephyr.dts not found"

          find build-dongle/zephyr -name "*.dtsi" -exec cp {} "$DTS_OUT/" \; 2>/dev/null || true
          find build-dongle -name "*.dts.pre" -exec cp {} "$DTS_OUT/" \; 2>/dev/null || true

          echo "=== Captured devicetree files ==="
          ls -la "$DTS_OUT/"
          echo ""
          echo "=== zephyr.dts.pre line count ==="
          wc -l "$DTS_OUT/zephyr.dts.pre" 2>/dev/null || echo "not available"
          echo ""
          echo "=== Keymap section check ==="
          grep -c "keymap" "$DTS_OUT/zephyr.dts.pre" 2>/dev/null || echo "no keymap found"

      - name: Upload devicetree artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-files
          path: dts-extracted/
          retention-days: 7