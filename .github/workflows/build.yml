name: Build ZMK Firmware

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  extract-dts-pre:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gettext cmake git \
            gcc-arm-none-eabi device-tree-compiler
          pip3 install west

      - name: Download Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64_minimal.tar.gz
          tar xzf zephyr-sdk-0.16.5_linux-x86_64_minimal.tar.gz

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update -o -L

      - name: Build Dongle
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
          ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/zephyr-sdk-0.16.5
        run: west build -b nice_nano@2 --pristine -s config --shield eyelash_sofle_central_dongle dongle_display raw_hid_adapter

      - name: Upload dts.pre
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dts-pre
          path: build/zephyr/zephyr.dts.pre