name: Build and Generate Keymap

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build peripheral-left to extract the merged devicetree (with keymap)
  # ---------------------------------------------------------------------------
  generate-keymap-json:
    name: Generate keymap.json
    runs-on: ubuntu-22.04

    steps:
      # ---- 1. Checkout source ------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---- 2. Install system packages ------------------------------------------
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build ccache dfu-util device-tree-compiler \
            python3 python3-pip python3-venv wget \
            gcc gcc-aarch64-linux-gnu gcc-arm-none-eabi

      # ---- 3. Install Python / West -------------------------------------------
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages west

      # ---- 4. Init West workspace ---------------------------------------------
      - name: West init
        run: |
          west init -l config
          west update 2>&1 || west update 2>&1

      # ---- 5. Install Zephyr Python requirements -----------------------------
      - name: Install Zephyr requirements
        run: |
          pip3 install --break-system-packages -r zephyr/scripts/requirements.txt

      # ---- 6. Install Zephyr SDK (with retry) --------------------------------
      - name: Install Zephyr SDK
        run: |
          wget --tries=3 --timeout=60 \
            -O /tmp/zephyr-sdk.tar.gz \
            "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64_minimal.tar.gz" \
          || wget --tries=3 --timeout=60 \
            -O /tmp/zephyr-sdk.tar.gz \
            "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.4/zephyr-sdk-0.16.4_linux-x86_64_minimal.tar.gz"
          tar xzf /tmp/zephyr-sdk.tar.gz -C /opt
          /opt/zephyr-sdk-0.16.*/setup.sh -t arm -c

      # ---- 7. Build peripheral-left (contains the keymap) --------------------
      - name: Build peripheral left
        run: |
          west build -b nice_nano@2 -s config \
            -- -DSHIELD=eyelash_sofle_peripheral_left \
               -DCMAKE_PREFIX_PATH=${{ github.workspace }}/zephyr/share/zephyr-package

      # ---- 8. Collect ALL devicetree files -----------------------------------
      - name: Collect devicetree files
        run: |
          BUILD_DIR=build
          ARTIFACT_DT=devicetree-files

          mkdir -p "${ARTIFACT_DT}"

          cp "${BUILD_DIR}/zephyr/zephyr.dts.pre" "${ARTIFACT_DT}/" 2>/dev/null || true
          cp "${BUILD_DIR}/zephyr/zephyr.dts" "${ARTIFACT_DT}/" 2>/dev/null || true
          cp "${BUILD_DIR}/zephyr/include/generated/zephyr/zephyr.dts" \
             "${ARTIFACT_DT}/zephyr.dts.generated" 2>/dev/null || true
          cp "${BUILD_DIR}/zephyr/include/generated/zephyr/devicetree_generated.h" \
             "${ARTIFACT_DT}/devicetree_generated.h" 2>/dev/null || true
          find "${BUILD_DIR}" -name "*.dtsi" -path "*zmk*" \
               -exec cp {} "${ARTIFACT_DT}/" \; 2>/dev/null || true

          echo "=== Files collected ==="
          ls -lhR "${ARTIFACT_DT}/"

      # ---- 9. Upload devicetree artifacts ------------------------------------
      - name: Upload devicetree files
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-files
          path: devicetree-files/
          retention-days: 7

      # ---- 10. Upload keymap.json artifact -----------------------------------
      - name: Upload keymap.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keymap-json
          path: |
            devicetree-files/keymap.json
          retention-days: 14
          if-no-files-found: warn
