name: ZMK Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      config_path: config

  extract-dts-pre:
    name: Extract devicetree files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl python3 python3-pip python3-venv ninja-build gperf ccache dfu-util device-tree-compiler

      - name: Install West
        run: pip3 install --user west

      - name: Add west to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: West init + update
        run: |
          west init -l config
          west update || west update

      - name: Install Python requirements
        run: pip3 install --user -r zephyr/scripts/requirements.txt

      - name: West build
        continue-on-error: true
        run: |
          west build -s zmk/app -b nice_nano@2 --pristine -d build-dongle -- \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/zephyr/share/zephyr-package" \
            -DSHIELD="eyelash_sofle_central_dongle dongle_display raw_hid_adapter" \
            -DZMK_CONFIG="${{ github.workspace }}/config"

      - name: Capture DTS
        if: always()
        run: |
          mkdir -p dts-extracted
          cp build-dongle/zephyr/zephyr.dts.pre dts-extracted/ 2>/dev/null || true
          cp build-dongle/zephyr/zephyr.dts dts-extracted/ 2>/dev/null || true
          find build-dongle -name "*.dtsi" -exec cp {} dts-extracted/ \; 2>/dev/null || true
          echo "=== Files ==="
          ls -la dts-extracted/
          echo "=== Keymap check ==="
          grep -c "keymap" dts-extracted/zephyr.dts.pre 2>/dev/null || echo "no keymap"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devicetree-files
          path: dts-extracted/
          retention-days: 7