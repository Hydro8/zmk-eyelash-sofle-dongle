# =============================================================================
# CONFIGURATION DE LA MOITIÉ GAUCHE (périphérique BLE)
# =============================================================================
#
# Ce fichier configure la moitié gauche du clavier Sofle.
# C'est un périphérique BLE qui envoie ses frappes au dongle central.
# Pas d'écran, pas d'USB — juste du Bluetooth et des touches.
#

# =============================================================================
# SPLIT BLE (périphérique)
# =============================================================================
# Contrairement au dongle, cette moitié n'a PAS CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# → ZMK la considère automatiquement comme un périphérique.
#
CONFIG_ZMK_SPLIT=y                # Mode split activé
CONFIG_ZMK_BLE=y                  # Bluetooth Low Energy (pour communiquer avec le dongle)
CONFIG_ZMK_SPLIT_BLE=y            # Split via BLE

# =============================================================================
# AFFICHAGE
# =============================================================================
# Pas d'écran OLED sur les moitiés du clavier (seulement sur le dongle).
# Désactivé pour économiser de la mémoire flash et RAM.
#
CONFIG_ZMK_DISPLAY=n