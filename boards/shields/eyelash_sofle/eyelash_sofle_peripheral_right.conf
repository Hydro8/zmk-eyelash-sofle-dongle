# =============================================================================
# RIGHT HALF CONFIGURATION — eyelash_sofle_peripheral_right.conf
# =============================================================================
#
# This file configures the RIGHT half of the Sofle split keyboard.
# It is a BLE peripheral that sends keypresses to the dongle central.
# No display, no USB — only Bluetooth and key switches.
#

# =============================================================================
# SPLIT BLE (peripheral)
# =============================================================================
#
# Unlike the dongle, this half does NOT have CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# so ZMK automatically treats it as a BLE peripheral.
#

# Enable split keyboard mode
CONFIG_ZMK_SPLIT=y

# Enable Bluetooth Low Energy (communication with the dongle)
CONFIG_ZMK_BLE=y

# Split communication via BLE
CONFIG_ZMK_SPLIT_BLE=y

# =============================================================================
# POWER MANAGEMENT
# =============================================================================
#
# Battery-powered peripheral: allow deep sleep after 2 hours of inactivity
# and keep software soft-off available.
#

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=y

# =============================================================================
# DISPLAY
# =============================================================================
#
# No OLED screen on the keyboard halves (only on the dongle).
# Disabled to save flash memory and RAM.
#

CONFIG_ZMK_DISPLAY=n

# =============================================================================
# PERSISTENT SETTINGS / BLE BONDS
# =============================================================================
#
# Persist split BLE security keys across peripheral reboots.
#

CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
