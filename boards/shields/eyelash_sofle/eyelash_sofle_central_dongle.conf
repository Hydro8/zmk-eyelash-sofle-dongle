# =============================================================================
# CENTRAL DONGLE CONFIGURATION
# =============================================================================
#
# This file configures the USB dongle that acts as the central receiver
# for both halves of the Sofle split keyboard.
#
# The dongle connects to the Mac via USB and communicates with the
# peripherals (left half + right half) via Bluetooth Low Energy.
#

# =============================================================================
# USB CONNECTION (to Mac)
# =============================================================================
#
# The dongle appears as a USB HID device to the Mac.
# Through this connection:
#   - Keyboard keypresses are sent (standard HID report)
#   - Raw HID reports are exchanged (Selenite protocol, 32 bytes)
#     Mac -> Dongle: target layer, auto/one-shot flags, app name
#     Dongle -> Mac: currently active layer number
#

# Enable USB connectivity
CONFIG_ZMK_USB=y

# Dongle is externally powered (via USB, no battery)
CONFIG_ZMK_EXT_POWER=y

# Disable NKRO (N-Key Rollover via extended HID report).
# NKRO uses an extended HID report that can conflict with Raw HID
# on some operating systems (especially macOS).
# In standard mode (6KRO), max 6 simultaneous keypresses — more than enough.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# =============================================================================
# SPLIT BLE (Dongle = Central, keyboards = Peripherals)
# =============================================================================
#
# Architecture: the 2 keyboard halves are BLE peripherals,
# the dongle is the central point that collects and merges their data.
#

# Enable split keyboard mode
CONFIG_ZMK_SPLIT=y

# This device is the CENTRAL (receiver)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Enable Bluetooth Low Energy
CONFIG_ZMK_BLE=y

# Split communication via BLE (not wired)
CONFIG_ZMK_SPLIT_BLE=y

# Number of BLE peripherals: left half + right half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# =============================================================================
# OLED DISPLAY ON DONGLE
# =============================================================================
#
# The dongle's OLED screen displays real-time keyboard status:
#   - Active layer name/number (CONFIG_ZMK_DONGLE_DISPLAY_LAYER)
#   - Currently held modifiers (CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS)
#   - macOS-specific modifier labels (Cmd, Option, Control)
#

# Enable the display subsystem
CONFIG_ZMK_DISPLAY=y

# LVGL graphics library for the OLED screen
CONFIG_LVGL=y

# SPI bus for display communication
CONFIG_SPI=y

# Widget: show the active layer name or number
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y

# Widget: show held modifier keys (S/H/C/A)
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y

# Show macOS-specific modifier labels (Cmd, Option, Control)
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# =============================================================================
# BATTERY
# =============================================================================
#
# The dongle itself has no battery (USB powered), but we enable battery
# tracking to display the charge level of the PERIPHERALS (both halves)
# on the dongle's OLED screen.
#

# Enable battery level tracking (for BLE peripherals)
CONFIG_ZMK_BATTERY=y

# Disable Battery Service on the dongle itself.
# The dongle is USB-powered, it has no battery to report.
CONFIG_BT_BAS=n

# =============================================================================
# BACKLIGHT (under switches)
# =============================================================================

# Enable switch backlight
CONFIG_ZMK_BACKLIGHT=y

# Backlight brightness at startup: 100%
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# Backlight on at boot
CONFIG_ZMK_BACKLIGHT_ON_START=y

# Do NOT auto-off backlight after idle
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# =============================================================================
# RGB UNDERGLOW (LED strip under the keyboard)
# =============================================================================

# Enable RGB underglow LED strip
CONFIG_ZMK_RGB_UNDERGLOW=y

# RGB powered from external source (USB)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# RGB on at startup
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Max brightness: 90% (prevents overheating)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90

# Auto-off RGB after idle timeout
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Auto-off RGB when disconnected from USB
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Starting hue: 160 (cyan/turquoise)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160

# Starting effect: 3 (depends on the RGB module)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# =============================================================================
# MOUSE & POINTING (trackball / trackpoint)
# =============================================================================

# Enable HID mouse protocol
CONFIG_ZMK_MOUSE=y

# Enable pointing sensor support
CONFIG_ZMK_POINTING=y

# =============================================================================
# ZMK STUDIO VIA BLE (remote management)
# =============================================================================
#
# Allows remote keyboard management via ZMK Studio (WebBLE).
# The dongle acts as a bridge: Studio (Mac/PC) -> BLE -> dongle -> keyboard.
#

# BLE management (pairing, unpairing)
CONFIG_ZMK_BLE_MANAGEMENT=y

# Studio commands via BLE (live configuration)
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Runtime input processor (for Studio)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y

# Input processor commands via BLE
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Runtime pointing sensor rotation
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

# Sensor rotation commands via BLE
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# =============================================================================
# PERSISTENT STORAGE (NVS)
# =============================================================================
#
# Saves certain states to flash memory so they persist across reboots
# (e.g. RGB brightness, BLE pairings).
#

# Zephyr storage subsystem
CONFIG_SETTINGS=y

# Debounce delay before saving to flash.
# Waits 10 seconds of inactivity before writing to flash
# to prevent premature wear on the flash memory.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# =============================================================================
# DISABLED FEATURES (firmware size reduction)
# =============================================================================
#
# The built-in ZMK Studio web server is disabled because we use
# the BLE-based version instead.
# Unnecessary features on the dongle are also disabled to save flash and RAM.
#

# No built-in Studio web server (using BLE version)
CONFIG_ZMK_STUDIO=n

# No passkey entry on the dongle
# (pairing is handled on the peripherals)
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Do NOT clear BLE bonds on startup
# (otherwise you'd have to re-pair both halves every boot)
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# No battery history (saves RAM)
CONFIG_ZMK_BATTERY_HISTORY=n

# No remote access to battery history
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n