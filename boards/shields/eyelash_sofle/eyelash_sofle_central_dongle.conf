# =============================================================================
# CONFIGURATION DU DONGLE CENTRAL (eyelash_sofle_central_dongle.conf)
# =============================================================================
#
# Ce fichier configure le dongle USB qui fait office de récepteur central
# pour les deux moitiés du clavier Sofle en BLE split.
#
# Le dongle est relié au Mac en USB et communique avec les périphériques
# (moitié gauche + moitié droite) en Bluetooth Low Energy.
#

# =============================================================================
# CONNEXION USB (vers le Mac)
# =============================================================================
# Le dongle apparaît comme un périphécle USB HID au Mac.
# C'est par cette connexion que passe :
#   - Les frappes clavier (rapport HID standard)
#   - Les rapports Raw HID (protocole Selenite, 32 octets)
#
CONFIG_ZMK_USB=y                    # Activation de la connexion USB
CONFIG_ZMK_EXT_POWER=y              # Le dongle est alimenté en externe (via USB, pas sur batterie)

# Désactivation du NKRO (N-Key Rollover via le protocole standard).
# Le NKRO utilise un rapport HID étendu qui peut entrer en conflit
# avec le Raw HID sur certains systèmes d'exploitation.
# En mode standard (6KRO), on a 6 touches simultanées max — largement suffisant.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# =============================================================================
# SPLIT BLE (Dongle = Central, claviers = Périphériques)
# =============================================================================
# Architecture : les 2 moitiés du clavier sont des périphériques BLE,
# le dongle est le point central qui collecte et fusionne les données.
#
CONFIG_ZMK_SPLIT=y                              # Activation du mode split
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y                 # Ce device est le CENTRAL (récepteur)
CONFIG_ZMK_BLE=y                                # Activation du Bluetooth Low Energy
CONFIG_ZMK_SPLIT_BLE=y                          # Split via BLE (pas filaire)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2      # 2 périphériques : moitié gauche + droite

# =============================================================================
# AFFICHAGE OLED DU DONGLE
# =============================================================================
# L'écran OLED du dongle affiche les infos de statut du clavier :
#   - Calque actif (CONFIG_ZMK_DONGLE_DISPLAY_LAYER)
#   - Modificateurs enfoncés (CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS)
#   - Modificateurs spécifiques macOS Cmd/Option/Control
#
CONFIG_ZMK_DISPLAY=y                            # Activation du sous-système affichage
CONFIG_LVGL=y                                   # Librairie graphique LVGL pour l'écran OLED
CONFIG_SPI=y                                    # Bus SPI pour la communication écran
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y               # Widget : affiche le nom/numéro du calque actif
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y           # Widget : affiche les mods enfoncés (S/H/C/A)
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y       # Affichage spécifique macOS (Cmd, Option, Control)

# =============================================================================
# BATTERIE
# =============================================================================
# Le dongle n'a pas de batterie (alimenté par USB), mais on active
# le suivi de batterie pour afficher le niveau des PERIPHERIQUES (moitiés).
#
CONFIG_ZMK_BATTERY=y                            # Suivi de la batterie (pour les périphériques BLE)
CONFIG_BT_BAS=n                                 # Pas de service Battery sur le dongle lui-même
                                                 # (le dongle est sur USB, pas de batterie à reporter)

# =============================================================================
# RETROÉCLAIRAGE (sous les touches)
# =============================================================================
CONFIG_ZMK_BACKLIGHT=y                          # Activation du rétroéclairage
CONFIG_ZMK_BACKLIGHT_BRT_START=100              # Luminosité au démarrage : 100%
CONFIG_ZMK_BACKLIGHT_ON_START=y                 # Rétroéclairage allumé au boot
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n            # PAS d'extinction automatique après inactivité

# =============================================================================
# RGB UNDERGLOW (LED sous le clavier)
# =============================================================================
CONFIG_ZMK_RGB_UNDERGLOW=y                      # Activation du ruban LED RGB
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y            # RGB alimenté par l'externe (USB)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y             # RGB allumé au démarrage
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90             # Luminosité max : 90% (évite la surchauffe)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y        # Extinction RGB après inactivité
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y         # Extinction RGB quand débranché de l'USB
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160          # Teinte de départ : 160 (cyan/turquoise)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3            # Effet de départ : 3 (selon le module RGB)

# =============================================================================
# SOURIS & POINTING (trackball / trackpoint)
# =============================================================================
CONFIG_ZMK_MOUSE=y                              # Support du protocole HID souris
CONFIG_ZMK_POINTING=y                           # Support des capteurs de pointage

# =============================================================================
# ZMK STUDIO VIA BLE (management à distance)
# =============================================================================
# Permet de gérer le clavier à distance via ZMK Studio (WebBLE).
# Le dongle agit comme pont : Studio (Mac/PC) → BLE → dongle → clavier.
#
CONFIG_ZMK_BLE_MANAGEMENT=y                     # Gestion BLE (appairage, suppression)
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y          # Commandes Studio via BLE (config en direct)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y            # Processeur d'entrée runtime (pour Studio)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y # Commandes d'input processor via BLE
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y              # Rotation du capteur de pointage runtime
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y   # Commandes de rotation via BLE

# =============================================================================
# STOCKAGE DES PARAMÈTRES
# =============================================================================
# Permet de sauvegarder certains états en flash (NVS) pour les conserver
# entre les redémarrages (ex: luminosité RGB, appairages BLE).
#
CONFIG_SETTINGS=y                               # Sous-système de stockage Zephyr
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000         # Délai anti-rebond pour les sauvegardes
                                                 # Attend 10 secondes d'inactivité avant d'écrire
                                                 # en flash (évite l'usure prématurée)

# =============================================================================
# DÉSACTIVATIONS (réduction de la taille du firmware)
# =============================================================================
# ZMK Studio intégré (UI web) est désactivé car on utilise la version BLE.
# On désactive aussi les fonctionnalités inutiles sur le dongle pour gagner
# de la mémoire flash et RAM.
#
CONFIG_ZMK_STUDIO=n                             # Pas de serveur Studio intégré (utilisé via BLE)
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n                  # Pas d'entrée de code d'appariage sur le dongle
                                                 # (l'appariement se fait sur les périphériques)
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n           # Ne PAS effacer les appairages au démarrage
                                                 # (sinon il faudrait réapparier les moitiés à chaque boot)
CONFIG_ZMK_BATTERY_HISTORY=n                    # Pas d'historique de batterie (économie de RAM)
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n         # Pas d'accès distant à l'historique batterie