# P3 security/bond diagnostic only — central dongle.
# No behavior, bond policy, HID wire or epoch changes.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=65536
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Sanitized runtime tracing only. Keep Bluetooth host modules at INFO so
# P3KEY/P3SET LOG_INF markers remain visible without enabling debug-level
# Bluetooth security logging that may expose private key material.
CONFIG_BT_KEYS_LOG_LEVEL_INF=y
CONFIG_BT_SMP_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
CONFIG_BT_GATT_LOG_LEVEL_INF=y
