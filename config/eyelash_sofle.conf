# =============================================================================
# SHARED CONFIGURATION — eyelash_sofle.conf
# =============================================================================
#
# This file is applied to ALL keyboard variants:
#   - Central dongle (USB + BLE central)
#   - Peripheral left (BLE only)
#   - Peripheral right (BLE only)
#
# It defines common settings shared across all build targets.
# Variant-specific settings are in *_central_dongle.conf and *_peripheral_*.conf
#

# =============================================================================
# SLEEP / POWER MANAGEMENT
# =============================================================================
#
# Idle timeout before entering sleep mode: 2 hours (7,200,000 ms).
# If no key is pressed for 2 hours, the peripherals enter deep sleep
# to preserve battery life.
#

# Idle timeout in milliseconds before sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Enable ZMK sleep subsystem.
# Allows peripherals (halves) to enter deep sleep state.
CONFIG_ZMK_SLEEP=y

# =============================================================================
# SOFTWARE POWER OFF
# =============================================================================
#
# Allows completely shutting down the keyboard (not just sleep).
# Useful for peripherals with a battery — you can fully power them off
# during transport to prevent battery drain.
#

# Enable soft power off behavior
CONFIG_ZMK_PM_SOFT_OFF=y

# =============================================================================
# RGB UNDERGLOW (global max brightness)
# =============================================================================
#
# Max brightness is capped at 60% here.
# The central_dongle.conf sets it to 90% — the most restrictive value
# wins at compile time (CMake takes the minimum).
# This also applies to peripherals if they have RGB LEDs.
#

# Global max RGB brightness: 60%
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# =============================================================================
# MOUSE (HID Mouse Protocol)
# =============================================================================
#
# Enable HID mouse protocol. This is also set in the dongle config,
# but defining it here ensures it's available for all build targets.
#

CONFIG_ZMK_MOUSE=y

# =============================================================================
# HID PROTOCOL
# =============================================================================
#
# NKRO is disabled to avoid conflicts with Raw HID on macOS.
# This is a shared setting applied to all build targets.
#

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# =============================================================================
# BATTERY
# =============================================================================
#
# Enable battery level tracking. Primarily useful for peripherals
# (halves with batteries). The dongle also enables this to receive
# battery levels from peripherals via BLE and display them on the OLED.
#

CONFIG_ZMK_BATTERY=y

# =============================================================================
# LVGL FONT
# =============================================================================
#
# Montserrat 24pt — used by the dongle display's layer_status widget
# to show the active layer name in large text on the OLED screen.
# Without this config, compilation would fail if the widget references
# &lv_font_montserrat_24 (unresolved symbol).
#

CONFIG_LV_FONT_MONTSERRAT_24=y

# =============================================================================
# ZMK STUDIO
# =============================================================================
#
# Built-in ZMK Studio (web UI) is disabled.
# We use ZMK Studio via BLE management instead.
#

CONFIG_ZMK_STUDIO=n