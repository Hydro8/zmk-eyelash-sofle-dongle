# =============================================================================
# CONFIGURATION GÉNÉRALE — eyelash_sofle.conf
# =============================================================================
#
# Ce fichier est appliqué à TOUTES les variantes du clavier :
#   - Central dongle (USB + BLE central)
#   - Périphérique gauche (BLE)
#   - Périphérique droit (BLE)
#
# Il définit les réglages communs. Les configs spécifiques à chaque variante
# sont dans les fichiers *_central_dongle.conf et *_peripheral_*.conf.
#

# =============================================================================
# MISE EN VEILLE (Power Management)
# =============================================================================
# Temps d'inactivité avant mise en veille : 2 heures (7 200 000 ms).
# Si aucune touche n'est pressée pendant 2h, le clavier se met en veille
# pour économiser la batterie des périphériques.
#
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000     # 2 heures en millisecondes

# Activation du sous-système de sommeil ZMK.
# Permet aux périphériques (moitiés) de se mettre en veille profonde.
CONFIG_ZMK_SLEEP=y

# =============================================================================
# EXTINCTION LOGICIELLE (Soft Off)
# =============================================================================
# Permet d'éteindre le clavier logiciellement (pas seulement mise en veille).
# Utile sur les moitiés qui ont une batterie — on peut les éteindre
# complètement pour ne pas vider la batterie pendant un transport prolongé.
#
CONFIG_ZMK_PM_SOFT_OFF=y

# =============================================================================
# RGB (Luminosité max globale)
# =============================================================================
# La luminosité max est limitée à 60% ici.
# Le dongle_central_dongle.conf la fixe à 90% — la valeur la plus restrictive
# l'emporte à la compilation.
# Note : cette config s'applique aussi aux périphériques si ils ont du RGB.
#
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# =============================================================================
# SOURIS (HID Mouse Protocol)
# =============================================================================
# Activation du protocole HID souris.
# Redondant avec le dongle_central_dongle.conf qui l'active aussi,
# mais utile si les périphériques gèrent un capteur de pointage localement.
#
CONFIG_ZMK_MOUSE=y

# =============================================================================
# PROTOCOLE HID
# =============================================================================
# NKRO désactivé pour le même motif que dans le dongle :
# éviter les conflits avec le Raw HID sur macOS.
#
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# =============================================================================
# BATTERIE
# =============================================================================
# Activation du suivi de batterie.
# Surtout utile pour les périphériques (moitiés) qui ont une batterie.
# Le dongle l'active aussi pour recevoir les niveaux via BLE.
#
CONFIG_ZMK_BATTERY=y

# =============================================================================
# POLICE LVGL (écran OLED du dongle)
# =============================================================================
# Montserrat 24pt — utilisée par le widget layer_status.c du dongle display
# pour afficher le nom du calque en gros sur l'écran OLED.
# Sans cette config, la compilation échouerait si le widget tente
# d'utiliser `&lv_font_montserrat_24` (référence non résolue).
#
CONFIG_LV_FONT_MONTSERRAT_24=y

# =============================================================================
# ZMK STUDIO
# =============================================================================
# ZMK Studio (interface web de configuration) désactivé.
# On utilise ZMK Studio via BLE management à la place.
#
CONFIG_ZMK_STUDIO=n