# P3 BLE stale-link diagnostic overlay — peripheral half only.
# Deliberately excluded from the normal four-target build.
# Adds USB CDC logging and ZMK debug verbosity so a tethered half can trace
# connected -> central loss -> disconnected/recycled -> advertising.
# No HID wire, keymap, bond, or production behavior is intentionally changed.

CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=32768
