# P3 BLE reconnect diagnostic overlay — central dongle only.
# This file is deliberately excluded from the normal four-target build.
# It adds USB CDC logging and ZMK debug verbosity without changing the
# qualified HID wire protocol or peripheral firmware.

CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=32768
